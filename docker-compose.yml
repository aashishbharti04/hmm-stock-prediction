# Full local/production-like stack: backend API + Next.js frontend + Redis cache.
#
#   docker compose up --build
#
# Frontend → http://localhost:3000   API → http://localhost:8000/docs
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
      CORS_ORIGINS: http://localhost:3000
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_REQUESTS: "120"
      # Set API_KEYS to require X-API-Key on analysis endpoints.
      # API_KEYS: ${API_KEYS:-}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
